# Local development stack: docker compose up --build
# App: http://localhost:5173 (Vite proxies /api and /ws to the backend)
# API docs: http://localhost:8000/api/docs
# The secrets below are for local use only.

name: auction

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # No persistence: Redis is rebuilt from Postgres, so a restart starts empty.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    image: auction-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    image: auction-backend:dev
    environment:
      DATABASE_URL: postgresql+asyncpg://auction:auction@postgres:5432/auction
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: local-dev-session-secret-change-me
      ADMIN_PASSWORD: admin
      COOKIE_SECURE: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)
      interval: 3s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:5173/").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
