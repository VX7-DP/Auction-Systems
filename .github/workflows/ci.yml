name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auction
          POSTGRES_PASSWORD: auction
          POSTGRES_DB: auction
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Stack starts and passes the Stage 1 end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose up --detach --build --wait --wait-timeout 300
      - name: Health through the backend and through the front-end proxy
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/health
          curl --fail --silent --show-error http://localhost:5173/api/health
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          cache-dependency-glob: backend/uv.lock
      # Two guests and the simulated bidders through the front-end proxy, a real Redis
      # restart mid-auction, then the close. Takes about a minute.
      - name: Stage 1 done-signal, end to end
        working-directory: backend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: |
          uv sync --locked
          uv run pytest tests/e2e -v
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
